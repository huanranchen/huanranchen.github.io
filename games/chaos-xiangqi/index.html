<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>万宁象棋大招复刻 · Lv.30 好友PVP</title>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js"></script>
<style>
:root{--bg:#101418;--panel:#171d23;--line:#7b6745;--board:#d8b77b;--red:#b91c1c;--black:#18212a;--text:#f4f4f5;--muted:#a1a1aa;--accent:#f59e0b}
*{box-sizing:border-box} body{margin:0;background:radial-gradient(circle at 50% 0,#202833,#0d1117 55%);color:var(--text);font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh}
.app{width:min(100%,1000px);margin:auto;padding:14px}.top{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}.title{font-weight:900;font-size:clamp(20px,4vw,34px)}.tag{font-size:12px;color:#111;background:var(--accent);border-radius:999px;padding:3px 8px;font-weight:800}
.card{background:rgba(23,29,35,.95);border:1px solid #303946;border-radius:16px;padding:14px;box-shadow:0 10px 30px #0005}.lobby{max-width:560px;margin:8vh auto}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}button,input{font:inherit}button{border:0;border-radius:10px;padding:10px 14px;background:#2a3440;color:white;font-weight:750;cursor:pointer}button.primary{background:#f59e0b;color:#17120a}button.danger{background:#7f1d1d}button:disabled{opacity:.4;cursor:not-allowed}input{min-width:0;flex:1;border:1px solid #3b4654;background:#0d1218;color:white;border-radius:10px;padding:10px}.hint{color:var(--muted);font-size:13px;line-height:1.55}.status{font-size:13px;color:#d4d4d8;margin-top:10px}.game{display:none}.layout{display:grid;grid-template-columns:minmax(300px,620px) minmax(260px,1fr);gap:14px;align-items:start}
.board-wrap{position:relative;background:#3b2b17;border-radius:14px;padding:10px;box-shadow:0 12px 35px #0007}.board{width:100%;aspect-ratio:9/10;display:grid;grid-template-columns:repeat(9,1fr);grid-template-rows:repeat(10,1fr);background:var(--board);border:3px solid #4b3820;position:relative;overflow:hidden}.cell{position:relative;border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:center;touch-action:manipulation}.cell:nth-child(9n){border-right:0}.cell.river{border-top:3px solid #5a4628}.cell.sel{background:#fde68a99}.cell.target{background:#86efac66}.cell.last{box-shadow:inset 0 0 0 3px #f59e0b}.cell.mark{box-shadow:inset 0 0 0 4px #ef4444;background:#ef444433}.cell.blast{animation:flash .45s ease}@keyframes flash{0%{filter:brightness(2)}100%{filter:none}}.piece{width:82%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:#f2deb8;border:2px solid currentColor;box-shadow:0 2px 4px #0007;font-size:clamp(17px,5.8vw,34px);font-family:serif;font-weight:900;user-select:none}.piece.red{color:var(--red)}.piece.black{color:var(--black)}.river-label{position:absolute;pointer-events:none;left:10%;right:10%;top:50%;transform:translateY(-50%);display:flex;justify-content:space-around;font:900 clamp(14px,3.6vw,26px) serif;color:#5c4526aa;letter-spacing:.5em}
.side{display:flex;flex-direction:column;gap:12px}.turn{font-weight:900;font-size:18px}.you{font-size:13px;color:var(--muted)}.skills{display:grid;grid-template-columns:1fr 1fr;gap:8px}.skill{text-align:left;padding:10px;background:#232c36;border:1px solid #394553;min-height:66px}.skill b{display:block;color:#fbbf24}.skill small{display:block;color:#b6bcc5;font-weight:500;margin-top:3px;line-height:1.3}.skill.active{outline:3px solid #f59e0b}.skill.used{opacity:.35}.log{height:180px;overflow:auto;background:#0d1218;border-radius:10px;padding:9px;font-size:12px;color:#cbd5e1;line-height:1.55}.pill{display:inline-block;background:#29323c;border-radius:999px;padding:3px 8px;font-size:12px;color:#cbd5e1}.banner{margin-bottom:9px;padding:8px 10px;border-radius:10px;background:#1e293b;font-size:13px}.win{background:#713f12;color:#fef3c7;font-weight:900}.roomline{font-size:12px;word-break:break-all;color:#cbd5e1;margin-top:6px}
@media(max-width:760px){.app{padding:8px}.layout{grid-template-columns:1fr}.side{order:-1}.skills{grid-template-columns:repeat(3,1fr)}.skill{padding:8px;min-height:60px}.skill small{display:none}.log{height:105px}.board-wrap{padding:7px}.piece{font-size:clamp(18px,7vw,32px)}}
</style>
</head>
<body>
<div class="app">
  <div class="top"><div class="title">万宁象棋大招复刻 <span class="tag">Lv.30 好友PVP</span></div><span class="pill">网页直玩 · 无广告</span></div>

  <section id="lobby" class="card lobby">
    <h2 style="margin-top:0">发个链接，直接和好友开打</h2>
    <p class="hint">以 Keepmobi v20250616 网页版对应的大招谱系做 clean-room 复刻：不使用原作代码/素材；双方开局各选一个满级大招，房间状态由房主权威同步。</p>
    <div id="hostControls">
      <button id="createBtn" class="primary">创建好友房</button>
    </div>
    <div id="joinControls" style="display:none">
      <div class="row"><button id="joinBtn" class="primary">加入好友房</button><button id="backBtn">自己开房</button></div>
    </div>
    <div id="shareBox" style="display:none;margin-top:12px">
      <div class="row"><input id="shareUrl" readonly/><button id="copyBtn">复制链接</button></div>
      <div class="hint" style="margin-top:7px">把这个链接发给好友。他打开后点“加入好友房”即可。</div>
    </div>
    <div id="lobbyStatus" class="status">尚未连接。</div>
  </section>

  <section id="game" class="game">
    <div class="layout">
      <div class="board-wrap">
        <div id="board" class="board"></div>
        <div class="river-label"><span>楚河</span><span>汉界</span></div>
      </div>
      <aside class="side">
        <div class="card">
          <div id="banner" class="banner">连接中…</div>
          <div id="turnText" class="turn"></div>
          <div id="youText" class="you"></div>
          <div id="roomLine" class="roomline"></div>
        </div>
        <div class="card">
          <div style="font-weight:900;margin-bottom:8px">大招模式 · 全部按满级实现</div>
          <div class="skills" id="skills"></div>
          <div id="skillHint" class="hint" style="margin-top:8px">双方各选一个满级大招；选定后本局锁定。</div>
        </div>
        <div class="card">
          <div class="row"><button id="restartBtn">重新开局</button><button id="copyRoomBtn">复制房间链接</button></div>
          <div style="font-weight:900;margin:10px 0 6px">战报</div><div id="log" class="log"></div>
        </div>
      </aside>
    </div>
  </section>
</div>
<script>
(() => {
'use strict';
const $=s=>document.querySelector(s);
const lobby=$('#lobby'), game=$('#game'), boardEl=$('#board'), statusEl=$('#lobbyStatus');
let peer=null, conn=null, role=null, myColor=null, state=null, selected=null, skillMode=null, skillFrom=null;
const roomParam=new URLSearchParams(location.search).get('room');
const CNAME={r:'红方',b:'黑方'};
const PIECE_CHARS={
  r:{K:'帅',A:'仕',B:'相',N:'马',R:'车',C:'炮',P:'兵',M:'妈',D:'龍'},
  b:{K:'将',A:'士',B:'象',N:'马',R:'车',C:'炮',P:'卒',M:'妈',D:'龍'}
};
const LV=30;
const SKILLS=[
  {id:'mama',name:'妈妈计',desc:'满级：两匹马变“妈”；妈不可被吃。'},
  {id:'touliang',name:'偷梁换柱',desc:'Lv.30：每次走棋后，最多30枚敌子变成我方兵。'},
  {id:'meiren',name:'美人计',desc:'Lv.30：每次走棋后，最多30枚敌子被吸向楚河2格；入河自毁。'},
  {id:'four2',name:'四个二',desc:'Lv.30：每次走棋后随机轰炸30个点；满级优先命中将帅。'},
  {id:'jinchan',name:'金蝉脱壳',desc:'Lv.30：将帅将被吃时，可与场上棋子换位，最多30次。'},
  {id:'caomu',name:'草木皆兵',desc:'满级被动：每次走棋后在空位大量生成最高阶棋子“车”。'},
  {id:'chenhuo',name:'趁火打劫',desc:'Lv.30：吃子后，附近生成最多30枚同类型己方棋子。'},
  {id:'wuzhong',name:'无中生有',desc:'Lv.30：首回合随机把30个空位变为己方炮。'},
  {id:'huangen',name:'皇恩浩荡',desc:'Lv.30：首回合增加30枚将；移动一将，其余无阻挡的将同步。'},
  {id:'yuqin',name:'欲擒故纵',desc:'己方棋子被吃后，周围留下3个标记；一回合后爆炸。'},
  {id:'dragon',name:'召唤神龙',desc:'满级：开局额外召唤30枚“龍”。'},
  {id:'huhu',name:'虎虎生威',desc:'移动棋子后，猛虎摧毁其周围格子的敌方棋子。'}
];

if(roomParam){ $('#hostControls').style.display='none'; $('#joinControls').style.display='block'; statusEl.textContent='检测到好友房链接：'+roomParam; }
$('#backBtn').onclick=()=>{history.replaceState(null,'',location.pathname);location.reload()};
$('#createBtn').onclick=createRoom; $('#joinBtn').onclick=joinRoom; $('#copyBtn').onclick=copyShare; $('#copyRoomBtn').onclick=copyShare;

$('#restartBtn').onclick=()=>sendAction({type:'restart'});

function makeId(){return 'lxq-'+Math.random().toString(36).slice(2,8)+'-'+Date.now().toString(36).slice(-4)}
function makePeer(id){
  try{return new Peer(id||undefined,{debug:1})}catch(e){statusEl.textContent='PeerJS 初始化失败：'+e.message;throw e}
}
function createRoom(){
  if(peer)return; role='host'; myColor='r'; statusEl.textContent='正在创建房间…';
  peer=makePeer(makeId());
  peer.on('open',id=>{
    const u=new URL(location.href);u.search='';u.searchParams.set('room',id);
    $('#shareUrl').value=u.toString();$('#shareBox').style.display='block';
    statusEl.textContent='房间已创建，等待好友加入…';
    state=initialState(); render();
  });
  peer.on('connection',c=>{
    if(conn && conn.open){c.close();return}
    conn=c; wireConn(true);
  });
  peer.on('error',peerError);
}
function joinRoom(){
  if(peer)return; role='guest'; myColor='b'; statusEl.textContent='正在连接好友房…';
  peer=makePeer();
  peer.on('open',()=>{conn=peer.connect(roomParam,{reliable:true});wireConn(false)});
  peer.on('error',peerError);
}
function peerError(e){statusEl.textContent='联机错误：'+(e?.type||e?.message||e); if($('#game').style.display==='block') $('#banner').textContent='联机异常：'+(e?.type||'unknown')}
function wireConn(asHost){
  conn.on('open',()=>{
    statusEl.textContent='好友已连接！';
    if(asHost){broadcastState();showGame()} else {conn.send({type:'hello'});}
  });
  conn.on('data',msg=>{
    if(!msg||typeof msg!=='object')return;
    if(role==='host' && msg.type==='action') hostHandle(msg.action,'b');
    if(role==='guest' && msg.type==='state'){state=msg.state;showGame();render()}
    if(role==='host' && msg.type==='hello') broadcastState();
  });
  conn.on('close',()=>{$('#banner').textContent='好友已断开连接';});
  conn.on('error',peerError);
}
function showGame(){lobby.style.display='none';game.style.display='block';render()}
async function copyShare(){
  const v=$('#shareUrl').value || (()=>{const u=new URL(location.href); if(role==='host'&&peer?.id){u.search='';u.searchParams.set('room',peer.id)} return u.toString()})();
  try{await navigator.clipboard.writeText(v); $('#banner').textContent='房间链接已复制 ✓'}catch{prompt('复制这个链接：',v)}
}

function initialBoard(){
  const b=Array.from({length:10},()=>Array(9).fill(null));
  const back=['R','N','B','A','K','A','B','N','R'];
  back.forEach((t,c)=>{b[0][c]={t,c:'b',royal:t==='K'};b[9][c]={t,c:'r',royal:t==='K'}});
  b[2][1]={t:'C',c:'b'};b[2][7]={t:'C',c:'b'};b[7][1]={t:'C',c:'r'};b[7][7]={t:'C',c:'r'};
  [0,2,4,6,8].forEach(c=>{b[3][c]={t:'P',c:'b'};b[6][c]={t:'P',c:'r'}});
  return b;
}
function initialState(){return {
  board:initialBoard(),turn:'r',winner:null,draw:false,last:null,
  choice:{r:null,b:null},started:false,
  firstTurn:{r:true,b:true},jinchanLeft:{r:LV,b:LV},
  pendingBombs:{r:[],b:[]},log:['双方先选择一个满级大招。两边都选好后红方先行。'],seq:0
}}
function opp(c){return c==='r'?'b':'r'}
function cloneBoard(b){return b.map(row=>row.map(p=>p?{...p}:null))}
function inB(r,c){return r>=0&&r<10&&c>=0&&c<9}
function betweenCount(b,r1,c1,r2,c2){let n=0;if(r1===r2){for(let c=Math.min(c1,c2)+1;c<Math.max(c1,c2);c++)if(b[r1][c])n++}else if(c1===c2){for(let r=Math.min(r1,r2)+1;r<Math.max(r1,r2);r++)if(b[r][c1])n++}else return 99;return n}
function palace(color,r,c){return c>=3&&c<=5&&(color==='r'?r>=7&&r<=9:r>=0&&r<=2)}
function crossed(color,r){return color==='r'?r<=4:r>=5}
function basicCanMove(b,fr,fc,tr,tc){
  if(!inB(fr,fc)||!inB(tr,tc)||(fr===tr&&fc===tc))return false;
  const p=b[fr][fc]; if(!p)return false;
  const q=b[tr][tc]; if(q&&q.c===p.c)return false;
  if(q&&q.t==='M')return false;
  const dr=tr-fr,dc=tc-fc,ar=Math.abs(dr),ac=Math.abs(dc);
  switch(p.t){
    case'R': return (dr===0||dc===0)&&betweenCount(b,fr,fc,tr,tc)===0;
    case'C': {const n=betweenCount(b,fr,fc,tr,tc);return (dr===0||dc===0)&&(q?n===1:n===0)}
    case'N': case'M': {
      if(!((ar===2&&ac===1)||(ar===1&&ac===2)))return false;
      const lr=fr+(ar===2?Math.sign(dr):0),lc=fc+(ac===2?Math.sign(dc):0);
      return !b[lr][lc];
    }
    case'D': return ar+ac===1;
    case'B': {
      if(ar!==2||ac!==2)return false;
      if(p.c==='r'&&tr<5)return false;if(p.c==='b'&&tr>4)return false;
      return !b[fr+dr/2][fc+dc/2];
    }
    case'A': return ar===1&&ac===1&&palace(p.c,tr,tc);
    case'K': {
      if(state?.choice?.[p.c]==='huangen') return ar+ac===1;
      if(ar+ac===1&&palace(p.c,tr,tc))return true;
      if(dc===0&&q&&q.t==='K'&&q.royal&&q.c!==p.c&&betweenCount(b,fr,fc,tr,tc)===0)return true;
      return false;
    }
    case'P': {
      const fw=p.c==='r'?-1:1;
      if(dr===fw&&dc===0)return true;
      return crossed(p.c,fr)&&dr===0&&ac===1;
    }
  }
  return false;
}
function findRoyal(b,color){
  for(let r=0;r<10;r++)for(let c=0;c<9;c++){
    const p=b[r][c];if(p&&p.c===color&&p.t==='K'&&p.royal)return[r,c];
  }
  return null;
}
function attacked(b,r,c,by){
  for(let i=0;i<10;i++)for(let j=0;j<9;j++){
    const p=b[i][j];if(p&&p.c===by&&basicCanMove(b,i,j,r,c))return true;
  }
  return false;
}
function isLegal(b,fr,fc,tr,tc,color){
  const p=b[fr]?.[fc];if(!p||p.c!==color||!basicCanMove(b,fr,fc,tr,tc))return false;
  const nb=cloneBoard(b);nb[tr][tc]=nb[fr][fc];nb[fr][fc]=null;
  const k=findRoyal(nb,color);if(!k)return false;
  return !attacked(nb,k[0],k[1],opp(color));
}
function hasMove(b,color){
  for(let fr=0;fr<10;fr++)for(let fc=0;fc<9;fc++){
    const p=b[fr][fc];if(!p||p.c!==color)continue;
    for(let tr=0;tr<10;tr++)for(let tc=0;tc<9;tc++)if(isLegal(b,fr,fc,tr,tc,color))return true;
  }
  return false;
}
function inCheck(b,color){const k=findRoyal(b,color);return k?attacked(b,k[0],k[1],opp(color)):true}
function coord(r,c){return String.fromCharCode(65+c)+(10-r)}

function sendAction(action){
  if(!state)return;
  if(role==='host')hostHandle(action,'r'); else if(conn?.open)conn.send({type:'action',action});
}
function hostHandle(a,color){
  if(!state)return;
  if(a.type==='restart'){state=initialState();broadcastState();render();return}
  if(a.type==='choose'){chooseSkill(a.id,color);broadcastState();render();return}
  if(!state.started||state.winner||state.draw||state.turn!==color)return;
  if(a.type==='move')applyMove(a,color);
  broadcastState();render();
}
function addLog(s){state.log.push(s);if(state.log.length>80)state.log.shift()}
function applyMove(a,color){
  const {fr,fc,tr,tc}=a;
  if(!isLegal(state.board,fr,fc,tr,tc,color))return;

  let moving=state.board[fr][fc];
  let taken=state.board[tr][tc];

  // 金蝉脱壳：皇/帅将被吃时先换位，再由攻击方吃掉替身。
  if(taken?.royal && state.choice[taken.c]==='jinchan' && state.jinchanLeft[taken.c]>0){
    const candidates=allPieces((p,r,c)=>!(r===tr&&c===tc) && !(p.t==='M'));
    if(candidates.length){
      const [sr,sc,swapPiece]=pick(candidates);
      state.board[sr][sc]=taken;
      state.board[tr][tc]=swapPiece;
      state.jinchanLeft[taken.c]--;
      addLog(`${CNAME[taken.c]}「金蝉脱壳」：将帅与 ${coord(sr,sc)} 棋子换位，剩余 ${state.jinchanLeft[taken.c]} 次。`);
      taken=state.board[tr][tc];
    }
  }

  const captured=taken?{...taken}:null;
  state.board[tr][tc]=moving;
  state.board[fr][fc]=null;
  state.last={fr,fc,tr,tc};
  addLog(`${CNAME[color]} ${PIECE_CHARS[color][moving.t]} ${coord(fr,fc)}→${coord(tr,tc)}${captured?'，吃 '+PIECE_CHARS[captured.c][captured.t]:''}`);

  if(captured){
    if(state.choice[captured.c]==='yuqin') markYuqin(captured.c,tr,tc);
    if(state.choice[color]==='chenhuo') triggerChenhuo(color,captured,tr,tc);
  }

  if(state.choice[color]==='huangen' && moving.t==='K'){
    syncKings(color,fr,fc,tr,tc);
  }

  triggerAfterMove(color,tr,tc);
  state.firstTurn[color]=false;
  checkRoyalDeaths();
  if(state.winner||state.draw)return;
  finishNormalMove(color);
}
function finishNormalMove(color){
  const n=opp(color);
  state.turn=n;
  resolvePendingBombs(n);
  checkRoyalDeaths();
  if(state.winner||state.draw)return;
  if(!hasMove(state.board,n)){
    if(inCheck(state.board,n)){state.winner=color;addLog(`${CNAME[n]} 无合法应手，${CNAME[color]} 获胜！`)}
    else{state.draw=true;addLog('无子可动，和棋。')}
  }
}
function chooseSkill(id,color){
  if(state.started||state.choice[color]||!SKILLS.some(x=>x.id===id))return;
  state.choice[color]=id;
  addLog(`${CNAME[color]} 选择满级「${SKILLS.find(x=>x.id===id).name}」。`);
  if(state.choice.r&&state.choice.b){
    state.started=true;
    addLog('双方大招确定，全部按满级参数启动。');
    applyOpeningSkill('r');
    applyOpeningSkill('b');
    checkRoyalDeaths();
  }
}
function randShuffle(xs){
  for(let i=xs.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));[xs[i],xs[j]]=[xs[j],xs[i]];
  }
  return xs;
}
function pick(xs){return xs.length?xs[Math.floor(Math.random()*xs.length)]:null}
function allPieces(filter=()=>true){
  const xs=[];
  for(let r=0;r<10;r++)for(let c=0;c<9;c++){
    const p=state.board[r][c];if(p&&filter(p,r,c))xs.push([r,c,p]);
  }
  return xs;
}
function emptyCells(){
  const xs=[];for(let r=0;r<10;r++)for(let c=0;c<9;c++)if(!state.board[r][c])xs.push([r,c]);
  return xs;
}
function spawn(color,type,count,center=null,royal=false){
  let cells=emptyCells();
  if(center){
    const [cr,cc]=center;
    cells.sort((a,b)=>(Math.abs(a[0]-cr)+Math.abs(a[1]-cc))-(Math.abs(b[0]-cr)+Math.abs(b[1]-cc)));
  }else randShuffle(cells);
  const n=Math.min(count,cells.length);
  for(let i=0;i<n;i++){
    const [r,c]=cells[i];
    state.board[r][c]={t:type,c:color,royal:royal&&i===0};
  }
  return n;
}
function checkRoyalDeaths(){
  const kr=findRoyal(state.board,'r'),kb=findRoyal(state.board,'b');
  if(!kr&&!kb){state.draw=true;addLog('双方主将同时消失，和棋。')}
  else if(!kr){state.winner='b';addLog('红帅消失，黑方获胜！')}
  else if(!kb){state.winner='r';addLog('黑将消失，红方获胜！')}
}
function applyOpeningSkill(color){
  const id=state.choice[color];
  if(id==='mama'){
    let n=0;
    for(const [r,c,p] of allPieces(p=>p.c===color&&p.t==='N')){
      if(n>=2)break; state.board[r][c]={...p,t:'M'};n++;
    }
    addLog(`${CNAME[color]}「妈妈计」：两匹马变成不可被吃的“妈”。`);
  }
  if(id==='dragon'){
    const n=spawn(color,'D',30);
    addLog(`${CNAME[color]}「召唤神龙」：开局召唤 ${n} 枚龍。`);
  }
}
function triggerFirstTurn(color){
  if(!state.firstTurn[color])return;
  const id=state.choice[color];
  if(id==='wuzhong'){
    const n=spawn(color,'C',LV);
    addLog(`${CNAME[color]}「无中生有」：首回合生成 ${n} 门炮。`);
  }else if(id==='huangen'){
    const n=spawn(color,'K',LV);
    addLog(`${CNAME[color]}「皇恩浩荡」：首回合增加 ${n} 枚将字棋。`);
  }
}
function triggerAfterMove(color,r,c){
  triggerFirstTurn(color);
  const id=state.choice[color];
  if(id==='touliang')triggerTouliang(color);
  else if(id==='meiren')triggerMeiren(color);
  else if(id==='four2')triggerFour2(color);
  else if(id==='caomu')triggerCaomu(color);
  else if(id==='huhu')triggerHuhu(color,r,c);
}
function triggerTouliang(color){
  const enemy=opp(color);
  const targets=randShuffle(allPieces(p=>p.c===enemy)).slice(0,LV);
  for(const [r,c] of targets)state.board[r][c]={t:'P',c:color,royal:false};
  addLog(`${CNAME[color]}「偷梁换柱」：${targets.length} 枚敌子被换成己方兵。`);
}
function triggerMeiren(color){
  const enemy=opp(color);
  const targets=randShuffle(allPieces(p=>p.c===enemy)).slice(0,LV);
  let dead=0,moved=0;
  const occupied=new Set();
  for(const [r,c,p] of targets){
    if(!state.board[r][c]||state.board[r][c]!==p)continue;
    const dir=r<=4?1:-1, nr=r+2*dir;
    const crosses=(r<=4&&nr>=5)||(r>=5&&nr<=4);
    if(crosses){
      state.board[r][c]=null;dead++;continue;
    }
    if(inB(nr,c)&&!state.board[nr][c]&&!occupied.has(nr+','+c)){
      state.board[nr][c]=p;state.board[r][c]=null;occupied.add(nr+','+c);moved++;
    }
  }
  addLog(`${CNAME[color]}「美人计」：魅惑 ${targets.length} 枚敌子，${dead} 枚跳河自毁。`);
}
function triggerFour2(color){
  let cells=[];for(let r=0;r<10;r++)for(let c=0;c<9;c++)cells.push([r,c]);
  // 满级“提高炸到将的概率”：优先把敌方主将纳入轰炸池，其余随机补到30点。
  const enemy=opp(color),k=findRoyal(state.board,enemy),chosen=[];
  if(k)chosen.push(k);
  const rest=randShuffle(cells.filter(([r,c])=>!k||r!==k[0]||c!==k[1]));
  while(chosen.length<LV&&rest.length)chosen.push(rest.pop());
  let killed=0;
  for(const [r,c] of chosen){if(state.board[r][c]){state.board[r][c]=null;killed++;}}
  addLog(`${CNAME[color]}「四个二」：轰炸 ${chosen.length} 个点，命中 ${killed} 枚棋子。`);
}
function triggerCaomu(color){
  // 公开实测记录满级单次最高约32枚；最高阶棋子为“车”。
  const n=spawn(color,'R',32);
  addLog(`${CNAME[color]}「草木皆兵」：满级被动生成 ${n} 辆车。`);
}
function triggerChenhuo(color,captured,r,c){
  const n=spawn(color,captured.t,LV,[r,c]);
  addLog(`${CNAME[color]}「趁火打劫」：在吃子点附近生成 ${n} 枚${PIECE_CHARS[color][captured.t]}。`);
}
function markYuqin(color,r,c){
  const around=[];
  for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){
    if(!dr&&!dc)continue;const nr=r+dr,nc=c+dc;if(inB(nr,nc))around.push([nr,nc]);
  }
  const cells=randShuffle(around).slice(0,3);
  state.pendingBombs[color].push({cells,delay:1});
  addLog(`${CNAME[color]}「欲擒故纵」：留下 ${cells.length} 个爆炸标记。`);
}
function resolvePendingBombs(color){
  const keep=[];
  for(const pack of state.pendingBombs[color]){
    pack.delay--;
    if(pack.delay<=0){
      let n=0;
      for(const [r,c] of pack.cells){if(state.board[r][c]){state.board[r][c]=null;n++;}}
      addLog(`${CNAME[color]}「欲擒故纵」标记引爆，摧毁 ${n} 枚棋子。`);
    }else keep.push(pack);
  }
  state.pendingBombs[color]=keep;
}
function triggerHuhu(color,r,c){
  let n=0;
  for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){
    if(!dr&&!dc)continue;const nr=r+dr,nc=c+dc;if(!inB(nr,nc))continue;
    const p=state.board[nr][nc];
    if(p&&p.c!==color&&p.t!=='M'){state.board[nr][nc]=null;n++;}
  }
  addLog(`${CNAME[color]}「虎虎生威」：猛击周围，摧毁 ${n} 枚敌子。`);
}
function syncKings(color,fr,fc,tr,tc){
  const dr=tr-fr,dc=tc-fc;
  const movers=allPieces((p,r,c)=>p.c===color&&p.t==='K'&&!(r===tr&&c===tc));
  let moved=0;
  // 先收集，避免链式覆盖。
  const plans=[];
  for(const [r,c,p] of movers){
    const nr=r+dr,nc=c+dc;
    if(inB(nr,nc)&&!state.board[nr][nc])plans.push([r,c,nr,nc,p]);
  }
  for(const [r,c,nr,nc,p] of plans){
    if(state.board[r][c]===p&&!state.board[nr][nc]){
      state.board[nr][nc]=p;state.board[r][c]=null;moved++;
    }
  }
  addLog(`${CNAME[color]}「皇恩浩荡」：${moved} 枚将同步移动。`);
}
function broadcastState(){state.seq++;if(conn?.open)conn.send({type:'state',state})}

function render(){
  if(!state)return;
  renderBoard();renderSkills();
  const mine=myColor===state.turn,ended=state.winner||state.draw,ready=state.choice.r&&state.choice.b;
  $('#turnText').textContent=!ready?'等待双方选择大招':(ended?(state.draw?'和棋':`${CNAME[state.winner]}获胜`):`当前：${CNAME[state.turn]}${mine?'（轮到你）':''}`);
  const mySkill=state.choice[myColor]?SKILLS.find(x=>x.id===state.choice[myColor]).name:null;
  $('#youText').textContent=`你是 ${CNAME[myColor]} · ${role==='host'?'房主':'好友'}${mySkill?' · 大招：'+mySkill:''}${state.started&&inCheck(state.board,myColor)&&!ended?' · ⚠ 正被将军':''}`;
  $('#banner').className='banner'+(ended?' win':'');
  $('#banner').textContent=!ready?'先在下面选择一个大招；双方选好后自动开局。':(ended?(state.draw?'本局和棋。':`${CNAME[state.winner]}赢了！点“重新开局”再来。`):(mine?'轮到你走棋。':'等好友走棋…'));
  const room=role==='host'?peer?.id:roomParam;$('#roomLine').textContent=room?`房间：${room}`:'';
  $('#restartBtn').disabled=role!=='host';
  $('#log').innerHTML=state.log.map((x,i)=>`<div>${i+1}. ${esc(x)}</div>`).join('');$('#log').scrollTop=$('#log').scrollHeight;

}
function renderBoard(){
  boardEl.innerHTML='';const flip=myColor==='b';
  for(let vr=0;vr<10;vr++)for(let vc=0;vc<9;vc++){
    const r=flip?9-vr:vr,c=flip?8-vc:vc;const d=document.createElement('div');d.className='cell';if(vr===5)d.classList.add('river');
    if(selected&&selected[0]===r&&selected[1]===c)d.classList.add('sel');
    if(state.last&&((state.last.fr===r&&state.last.fc===c)||(state.last.tr===r&&state.last.tc===c)))d.classList.add('last');
    d.dataset.r=r;d.dataset.c=c;
    const marked=[...state.pendingBombs.r,...state.pendingBombs.b].some(pack=>pack.cells.some(x=>x[0]===r&&x[1]===c));
    if(marked)d.classList.add('mark');
    const p=state.board[r][c];
    if(p){
      const e=document.createElement('div');
      e.className='piece '+(p.c==='r'?'red':'black');
      e.textContent=PIECE_CHARS[p.c][p.t];
      d.appendChild(e);
    }
    d.onclick=()=>cellClick(r,c);boardEl.appendChild(d);
  }
}
function cellClick(r,c){
  if(!state||!state.started||state.winner||state.draw||state.turn!==myColor)return;const p=state.board[r][c];
  if(!selected){if(p&&p.c===myColor)selected=[r,c];render();return}
  if(p&&p.c===myColor){selected=[r,c];render();return}
  const [fr,fc]=selected;selected=null;sendAction({type:'move',fr,fc,tr:r,tc:c});render();
}
function renderSkills(){
  const wrap=$('#skills');wrap.innerHTML='';
  for(const sk of SKILLS){
    const b=document.createElement('button');b.className='skill';const mine=state.choice[myColor]===sk.id;if(mine)b.classList.add('active');
    b.disabled=!!state.choice[myColor]||state.started||!!state.winner||state.draw;
    b.innerHTML=`<b>${esc(sk.name)}${mine?' ✓':''}</b><small>${esc(sk.desc)}</small>`;b.onclick=()=>activateSkill(sk.id);wrap.appendChild(b);
  }
  const my=state.choice[myColor],op=state.choice[opp(myColor)];
  $('#skillHint').textContent=my?`你选择：${SKILLS.find(x=>x.id===my).name} Lv.30；${op?'对手：'+SKILLS.find(x=>x.id===op).name:'等待对手选择…'}`:'选择一个满级大招。双方各选一个；选定后本局锁定。';
}
function activateSkill(id){if(state.choice[myColor]||state.started)return;sendAction({type:'choose',id})}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
})();
</script>
</body>
</html>
